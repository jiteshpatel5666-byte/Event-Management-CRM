<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827"><title>Event CRM</title>
<style>
:root{--bg:#f4f6fa;--ink:#172033;--muted:#718096;--line:#e7ebf2;--blue:#315efb;--navy:#101827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Gujarati",sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;padding:22px 18px 18px;border-radius:0 0 22px 22px}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.sub{font-size:12px;color:#b8c2d4;margin-top:5px}
.pill{font-size:11px;background:#26354c;padding:7px 10px;border-radius:20px;color:#dbe6ff}
main{padding:16px;max-width:760px;margin:auto;padding-bottom:90px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-2px}
.metric{background:white;border:1px solid var(--line);border-radius:15px;padding:14px}.metric small{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:23px;margin-top:8px}
.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.section h2{font-size:17px;margin:0}.muted{color:var(--muted);font-size:12px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14px;background:white;color:var(--ink);outline:none}
.search{margin:14px 0 10px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.filters select{min-width:130px}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #17203308}
.cardtop{display:flex;justify-content:space-between;gap:10px}.eventname{font-weight:800;font-size:15px}.date{color:var(--blue);font-weight:700;font-size:12px}
.meta{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}.price{font-weight:800;margin-top:9px}
.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:var(--blue);color:white;font-size:13px}.btn.light{background:#eef2ff;color:#315efb}.btn.danger{background:#fff0f0;color:#c43c3c}.btn.full{width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;color:var(--muted);font-size:12px;padding:5px 12px}nav button.active{color:var(--blue);font-weight:800}
.page{display:none}.page.active{display:block}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}.wide{grid-column:1/-1}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 15px;border-radius:12px;display:none;font-size:13px;z-index:10}
@media(min-width:600px){.metrics{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div class="top"><div><div class="brand">Event CRM</div><div class="sub">તમારા ઇવેન્ટનું મેનેજમેન્ટ એક જ જગ્યાએ</div></div><span class="pill">ADMIN ONLY</span></div></header>
<main>
<section id="dashboard" class="page active">
 <div class="section"><h2>Dashboard</h2><span class="muted">Event Overview</span></div>
 <div class="metrics">
  <div class="metric"><small>Total Events</small><strong id="total">0</strong></div>
  <div class="metric"><small>Upcoming Events</small><strong id="upcoming">0</strong></div>
  <div class="metric"><small>Total Event Value</small><strong id="revenue">₹0</strong></div>
  <div class="metric"><small>Pending Payment</small><strong id="pendingTotal">₹0</strong></div>
 </div>
 <div class="section"><h2>આગામી ઇવેન્ટ</h2><button class="btn light" onclick="showPage('events')">બધા જુઓ</button></div>
 <div id="upcomingList"></div>
</section>
<section id="events" class="page">
 <div class="section"><h2>Event List</h2><button class="btn" onclick="newEvent()">+ Add Event</button></div>
 <input class="search" id="search" placeholder="Search event, venue, company..." oninput="renderEvents()">
 <div class="filters"><select id="yearFilter" onchange="renderEvents()"><option value="">બધા વર્ષ</option></select><select id="venueFilter" onchange="renderEvents()"><option value="">બધા Venue</option></select></div>
 <div id="eventList"></div>
</section>
<section id="calendar" class="page">
 <div class="section"><h2>Event Calendar</h2></div>
 <div class="field"><label>મહિનો પસંદ કરો</label><input type="month" id="monthFilter" onchange="renderCalendar()"></div>
 <div id="calendarList"></div>
</section>
<section id="formpage" class="page">
 <div class="section"><h2 id="formTitle">Add Event</h2><button class="btn light" onclick="showPage('events')">Back</button></div>
 <form id="eventForm" onsubmit="saveEvent(event)">
 <input type="hidden" id="id">
 <div class="formgrid">
 <div class="field"><label>Event Date</label><input id="date" type="date" required></div>
 <div class="field"><label>Price (₹)</label><input id="price" type="number" min="0"></div>
 <div class="field"><label>Party Plot / Venue</label><input id="venue" required></div>
 <div class="field"><label>Event Company</label><input id="company"></div>
 <div class="field wide"><label>Event Type</label><input id="event" required></div>
 <div class="field"><label>Customer Name</label><input id="customer"></div>
 <div class="field"><label>Mobile Number</label><input id="phone" type="tel"></div>
 <div class="field"><label>Photographer</label><input id="photo"></div>
 <div class="field"><label>Videographer</label><input id="video"></div>
 <div class="field"><label>Drone Operator</label><input id="drone"></div>
 <div class="field"><label>Advance (₹)</label><input id="advance" type="number" min="0"></div>
 <div class="field"><label>Pending (₹) – Auto</label><input id="pending" type="number" min="0" readonly></div>
 <div class="field wide"><label>Notes</label><textarea id="notes" rows="3"></textarea></div>
 </div><button class="btn full" type="submit">Save Event</button>
 </form>
</section>
</main>
<nav><button class="active" data-page="dashboard" onclick="showPage('dashboard')">⌂<br>Home</button><button data-page="events" onclick="showPage('events')">▤<br>Events</button><button data-page="calendar" onclick="showPage('calendar')">▦<br>Calendar</button></nav>
<div id="toast"></div>

const STORE='eventcrm_admin_events_v1';
let events=JSON.parse(localStorage.getItem(STORE)||'null')||initialEvents;
const money=n=>'₹'+(Number(n||0)).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(STORE,JSON.stringify(events));refresh()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='events')renderEvents();if(p==='calendar')renderCalendar();if(p==='dashboard')refresh()}
function sorted(){return [...events].sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
function card(e){return `<div class="card"><div class="cardtop"><div><div class="eventname">${esc(e.event||'Event')} · ${esc(e.venue)}</div><div class="meta">${esc(e.company)} ${e.customer?' · '+esc(e.customer):''}</div></div><div class="date">${esc(e.date)}</div></div><div class="price">${money(e.price)}</div><div class="meta">Photo: ${esc(e.photo||'—')} · Video: ${esc(e.video||'—')} · Drone: ${esc(e.drone||'—')}<br>${e.phone?'Mobile: '+esc(e.phone):''}${e.pending?' · Pending: '+money(e.pending):''}</div><div class="actions"><button class="btn light" onclick="editEvent('${esc(e.id)}')">Edit</button><button class="btn danger" onclick="deleteEvent('${esc(e.id)}')">Delete</button></div></div>`}
function refresh(){let today=new Date().toISOString().slice(0,10),up=sorted().filter(e=>e.date>=today);document.getElementById('total').textContent=events.length;document.getElementById('upcoming').textContent=up.length;document.getElementById('revenue').textContent=money(events.reduce((s,e)=>s+Number(e.price||0),0));document.getElementById('pendingTotal').textContent=money(events.reduce((s,e)=>s+Number(e.pending||0),0));document.getElementById('upcomingList').innerHTML=up.slice(0,5).map(card).join('')||'<div class="empty">આગામી ઇવેન્ટ નથી</div>';fillFilters()}
function fillFilters(){let yf=document.getElementById('yearFilter'),vf=document.getElementById('venueFilter'),ys=[...new Set(events.map(e=>(e.date||'').slice(0,4)).filter(Boolean))].sort(),vs=[...new Set(events.map(e=>e.venue).filter(Boolean))].sort();let y=yf.value,v=vf.value;yf.innerHTML='<option value="">બધા વર્ષ</option>'+ys.map(x=>`<option>${x}</option>`).join('');vf.innerHTML='<option value="">બધા Venue</option>'+vs.map(x=>`<option>${esc(x)}</option>`).join('');yf.value=y;vf.value=v}
function renderEvents(){let q=(document.getElementById('search').value||'').toLowerCase(),y=document.getElementById('yearFilter').value,v=document.getElementById('venueFilter').value;let a=sorted().filter(e=>(!q||[e.event,e.venue,e.company,e.customer,e.phone].join(' ').toLowerCase().includes(q))&&(!y||(e.date||'').startsWith(y))&&(!v||e.venue===v));document.getElementById('eventList').innerHTML=a.map(card).join('')||'<div class="empty">કોઈ ઇવેન્ટ મળી નથી</div>'}
function renderCalendar(){let m=document.getElementById('monthFilter').value;if(!m){m=new Date().toISOString().slice(0,7);document.getElementById('monthFilter').value=m}let a=sorted().filter(e=>(e.date||'').startsWith(m));document.getElementById('calendarList').innerHTML=a.map(card).join('')||'<div class="empty">આ મહિનામાં ઇવેન્ટ નથી</div>'}
function newEvent(){document.getElementById('eventForm').reset();document.getElementById('id').value='';document.getElementById('formTitle').textContent='Add Event';updatePending();showPage('formpage')}
function editEvent(id){let e=events.find(x=>x.id===id);if(!e)return;Object.keys(e).forEach(k=>{let el=document.getElementById(k);if(el)el.value=e[k]??''});document.getElementById('formTitle').textContent='Edit Event';updatePending();showPage('formpage')}
function updatePending(){let price=Number(document.getElementById('price').value||0),advance=Number(document.getElementById('advance').value||0);document.getElementById('pending').value=Math.max(0,price-advance)}
document.getElementById('price').addEventListener('input',updatePending);document.getElementById('advance').addEventListener('input',updatePending);
function saveEvent(ev){ev.preventDefault();updatePending();let id=document.getElementById('id').value||('new-'+Date.now());let obj={id};['date','price','venue','company','event','customer','phone','photo','video','drone','advance','pending','notes'].forEach(k=>obj[k]=document.getElementById(k).value);let i=events.findIndex(e=>e.id===id);if(i>=0)events[i]={...events[i],...obj};else events.push(obj);persist();showPage('events');toast('Event saved')}
function deleteEvent(id){if(!confirm('આ ઇવેન્ટ ડિલીટ કરવો છે?'))return;events=events.filter(e=>e.id!==id);persist();renderEvents();toast('Event deleted')}
refresh();
